name: Issue 2130 regenerate Ask pages

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/issue-2130-regenerate-ask.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'content/issue-2130-garba-ritual-centre'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: content/issue-2130-garba-ritual-centre
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Regenerate canonical Ask page index
        run: node scripts/lib/build-ask-pages.mjs

      - name: Validate regenerated index
        run: npm run ask:validate

      - name: Commit generated index and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-2130-regenerate-ask.yml
          git add assets/runtime/ask-pages.json
          git diff --cached --check
          git commit -m "Regenerate Ask page grounding for #2130"
          git push origin HEAD:content/issue-2130-garba-ritual-centre
