name: Apply BookPhysio sponsor placement

on:
  push:
    branches:
      - "design/issue-2022-bookphysio-sponsors"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "design/issue-2022-bookphysio-sponsors"
          fetch-depth: 0

      - name: Place sponsor art
        run: python .github/scripts/issue-2022-apply.py

      - name: Validate sponsor integration
        run: |
          node --check public-site/atmosphere/scene.js
          node scripts/lib/validate-immersive-atmosphere.mjs
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('public-site/atmosphere/sponsors').glob('bookphysio-*.webp'))
          if len(files) != 5:
              raise SystemExit(f'Expected 5 BookPhysio sponsor images, found {len(files)}')
          for p in files:
              data = p.read_bytes()
              if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise SystemExit(f'{p} is not a valid WebP container')
          print('Validated five BookPhysio sponsor images')
          PY
          git diff --check

      - name: Commit validated placement
        run: |
          rm .github/workflows/issue-2022-apply.yml .github/scripts/issue-2022-apply.py
          git config user.name "chatgpt-sol-bookphysio-sponsors-2022"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Place BookPhysio sponsors in outdoor venue"
          git push origin HEAD:design/issue-2022-bookphysio-sponsors
