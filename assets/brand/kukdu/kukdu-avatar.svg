    <path d="M60 73l6 11 7-11" stroke="#F7B94C" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M45 86c7 4 14 6 21 6s14-2 22-6M45 102c7 4 14 6 21 6s14-2 22-6" stroke="#E44A39" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M48 88l5 4-5 4-5-4 5-4Zm12 4 5-4 5 4-5 4-5-4Zm17-4 5 4-5 4-5-4 5-4Z" fill="#FFD46E"/>
    <circle cx="48" cy="92" r="1.7" fill="#FFF3CE"/>
    <circle cx="65" cy="92" r="1.7" fill="#FFF3CE"/>
    <circle cx="77" cy="92" r="1.7" fill="#FFF3CE"/>
    <path d="M46 105h40" stroke="#F7B94C" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4"/>

    <!-- Necklace -->
    <path d="M57 74c5 4 12 5 18 1" stroke="#B77922" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="66" cy="79" r="3.2" fill="#F7B94C" stroke="#FFF0B2" stroke-width="1.2"/>
    <circle cx="66" cy="79" r="1.1" fill="#D94737"/>
