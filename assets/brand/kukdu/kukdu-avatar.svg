<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 128 128" fill="none">
  <title>Kukdu, PlayGarba's rooster guide</title>
  <defs>
    <linearGradient id="body" x1="42" y1="28" x2="84" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD073"/>
      <stop offset=".55" stop-color="#F6A43E"/>
      <stop offset="1" stop-color="#DE762A"/>
    </linearGradient>
    <linearGradient id="cream" x1="54" y1="36" x2="72" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF1C8"/>
      <stop offset="1" stop-color="#F8D990"/>
    </linearGradient>
    <linearGradient id="comb" x1="50" y1="17" x2="73" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E3483F"/>
      <stop offset="1" stop-color="#A61F32"/>
    </linearGradient>
    <linearGradient id="tail" x1="16" y1="54" x2="45" y2="94" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18798A"/>
      <stop offset="1" stop-color="#063E4C"/>
    </linearGradient>
    <linearGradient id="vest" x1="36" y1="74" x2="84" y2="111" gradientUnits="userSpaceOnUse">
      <stop stop-color="#176272"/>
      <stop offset="1" stop-color="#0A3440"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.8" stdDeviation="1.8" flood-color="#3D1422" flood-opacity=".22"/>
    </filter>
  </defs>

  <g filter="url(#soft)">
    <!-- Tail feathers -->
    <path d="M42 82C29 78 17 68 14 55c10 2 19 7 25 14-6-11-6-22-1-31 8 8 12 17 12 29-1 7-4 12-8 15Z" fill="url(#tail)"/>
    <path d="M39 85C25 87 13 81 7 70c10-1 20 1 28 7-8-9-11-18-9-27 9 5 16 13 20 24 2 5 0 9-7 11Z" fill="#0B5666"/>
    <path d="M34 88C23 94 13 93 6 86c9-4 18-5 27-2-9-5-15-12-16-21 9 2 17 8 23 16 3 4 1 7-6 9Z" fill="#092F3B"/>
    <path d="M37 79C30 73 26 66 25 58c7 3 13 8 18 15" stroke="#D84A34" stroke-width="4" stroke-linecap="round"/>

    <!-- Body -->
    <path d="M39 91c0-18 10-31 27-31 18 0 30 14 30 32 0 15-11 26-29 26-18 0-28-11-28-27Z" fill="url(#body)"/>

    <!-- Neck ruff -->
    <path d="M49 69c-2-14 4-27 18-30 11-2 23 6 25 19 2 11-4 23-14 29l-9-8-8 8-6-9-6 5c-1-5-1-9 0-14Z" fill="url(#cream)"/>

    <!-- Comb -->
    <path d="M54 39c-7-5-9-12-5-18 4 1 7 4 9 8 0-9 5-15 12-16 3 5 3 10 1 15 5-6 12-7 17-3 0 7-4 12-10 16-8 4-17 3-24-2Z" fill="url(#comb)"/>

    <!-- Head -->
    <ellipse cx="69" cy="51" rx="23" ry="22" fill="url(#body)"/>
    <path d="M49 51c1-10 8-18 18-19 11-1 19 4 24 13-7-4-14-5-21-2-7 3-12 8-15 15l-6-7Z" fill="#F8C869" opacity=".8"/>
    <path d="M50 54c6-4 11-11 13-18 6 3 10 9 10 15 0 10-7 18-17 22-5-4-7-11-6-19Z" fill="url(#cream)"/>

    <!-- Eye -->
    <ellipse cx="72" cy="47" rx="8.5" ry="9.5" fill="#FFF9E8"/>
    <ellipse cx="74" cy="48" rx="4.4" ry="5.5" fill="#1D1717"/>
    <circle cx="75.5" cy="46.2" r="1.5" fill="#fff"/>
    <path d="M64 39c5-3 11-3 16 0" stroke="#8F3227" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Beak -->
    <path d="M87 50c10 0 19 3 27 8-8 7-18 10-28 8l-6-7 7-9Z" fill="#F7A928"/>
    <path d="M87 58c8 2 15 2 23 0-6 5-13 8-21 8" fill="#DB7222"/>
    <path d="M83 66c-1 6-5 10-10 11 0-5 1-9 5-13l5 2Z" fill="#B52B33"/>

    <!-- Smile line -->
    <path d="M78 64c3 1 6 1 9 0" stroke="#8A3A28" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Wing -->
    <path d="M72 87c10-4 18-1 23 7-4 10-12 16-22 18-6-6-8-17-1-25Z" fill="#E98A30"/>
    <path d="M76 91c7 0 13 4 16 10-4 4-9 7-14 8-4-5-5-11-2-18Z" fill="#F6B34D"/>

